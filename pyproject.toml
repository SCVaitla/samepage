[project]
name = "samepage"
version = "0.1.0"
description = "Turns disagreements between AI agents into an investigation, a human decision, and a verified fix."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional embedding backend for question equivalence. Not needed by default.
embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
samepage = "samepage.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["samepage"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# git is called with fixed argument lists and validated refs (see each call's comment).
"samepage/{corpus,arbiter,cli,evaluate}.py" = ["S603", "S607"]
"samepage/cli.py" = ["S603", "S607", "S104"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["samepage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: live run against a real Switch server, real agents and GitHub"]
addopts = "-m 'not e2e'"

[tool.coverage.run]
source = ["samepage"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", "spike"]
